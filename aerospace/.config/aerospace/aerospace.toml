config-version = 2

start-at-login = false
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# tamanho da "aba" visível das janelas empilhadas quando o container está em accordion
accordion-padding = 30

focus-follows-mouse.enabled = false

exec-on-workspace-change = ['/bin/bash', '-c', '/Users/danilosandrade/.config/sketchybar/plugins/aerospace_workspace.sh']
on-mode-changed = ['exec-and-forget /Users/danilosandrade/.config/sketchybar/plugins/aerospace_mode.sh']

# 7=DEV 8=WEB 9=COMM 0=DOCS minus=PERSONAL equal=MONITORING (ver cmd-ctrl-alt-shift-N abaixo)
persistent-workspaces = ["DEV", "WEB", "COMM", "DOCS", "PERSONAL", "MONITORING"]

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.right = 8
gaps.outer.top = 8
gaps.outer.bottom = 8

[mode.main.binding]
cmd-ctrl-alt-shift-h = 'focus left'
cmd-ctrl-alt-shift-j = 'focus down'
cmd-ctrl-alt-shift-k = 'focus up'
cmd-ctrl-alt-shift-l = 'focus right'

cmd-ctrl-alt-shift-7 = 'workspace DEV'
cmd-ctrl-alt-shift-8 = 'workspace WEB'
cmd-ctrl-alt-shift-9 = 'workspace COMM'
cmd-ctrl-alt-shift-0 = 'workspace DOCS'
cmd-ctrl-alt-shift-minus = 'workspace PERSONAL'
cmd-ctrl-alt-shift-equal = 'workspace MONITORING'

cmd-ctrl-alt-shift-tab = 'workspace-back-and-forth'

# alterna o container atual entre tiles (lado a lado) e accordion (empilhado)
cmd-ctrl-alt-shift-a = 'layout accordion tiles'

# entra no modo window (mover/trocar/mandar janela pra outro workspace)
cmd-ctrl-alt-shift-w = 'mode window'

# entra no modo resize (ajustar largura/altura da janela focada)
cmd-ctrl-alt-shift-r = 'mode resize'

# entra no modo service (reset de layout, floating avulso, fechar outras, join-with)
cmd-ctrl-alt-shift-space = 'mode service'

[mode.window.binding]
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'

# rotacionar/trocar posição com a janela vizinha, sem mover o foco
shift-h = 'swap left --wrap-around'
shift-j = 'swap down --wrap-around'
shift-k = 'swap up --wrap-around'
shift-l = 'swap right --wrap-around'

1 = 'move-node-to-workspace DEV'
2 = 'move-node-to-workspace WEB'
3 = 'move-node-to-workspace COMM'
4 = 'move-node-to-workspace DOCS'
5 = 'move-node-to-workspace PERSONAL'
6 = 'move-node-to-workspace MONITORING'

esc = 'mode main'
enter = 'mode main'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height -50'
k = 'resize height +50'

esc = 'mode main'
enter = 'mode main'

[mode.service.binding]
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
q = ['close-all-windows-but-current', 'mode main']

h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

esc = 'mode main'
enter = 'mode main'

# --- DEV ---
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm' # WezTerm
run = ['move-node-to-workspace DEV --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.sublimetext.4' # Sublime Text
run = ['move-node-to-workspace DEV --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.axosoft.gitkraken' # GitKraken
run = ['move-node-to-workspace DEV --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop' # Claude (desktop)
run = ['move-node-to-workspace DEV --focus-follows-window']

# --- WEB ---
[[on-window-detected]]
if.app-id = 'com.google.Chrome' # Google Chrome
run = ['move-node-to-workspace WEB --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.agimnkijcaahngcdmfeangaknmldooml' # YouTube (Chrome app/PWA)
run = ['move-node-to-workspace WEB --focus-follows-window']

# --- COMM ---
[[on-window-detected]]
if.app-id = 'com.apple.iCal' # Calendário
run = ['move-node-to-workspace COMM --focus-follows-window']

# --- DOCS ---
[[on-window-detected]]
if.app-id = 'md.obsidian' # Obsidian
run = ['move-node-to-workspace DOCS --focus-follows-window']

[[on-window-detected]]
if.app-id = 'notion.id' # Notion
run = ['move-node-to-workspace DOCS --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.apple.Preview' # Pré-Visualização (Preview)
run = ['move-node-to-workspace DOCS --focus-follows-window']

# --- Floating: janelas de preferências / ferramentas pequenas, não fazem sentido em tile ---
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences' # Ajustes do Sistema
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.f-secure.fscunifiedui' # F-Secure
run = ['layout floating']
