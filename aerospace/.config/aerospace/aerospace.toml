config-version = 2

start-at-login = false
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

focus-follows-mouse.enabled = false

# 1=DEV 2=WEB 3=COMM 4=DOCS 5=PERSONAL 6=MONITORING (ver ctrl-alt-N abaixo)
persistent-workspaces = ["DEV", "WEB", "COMM", "DOCS", "PERSONAL", "MONITORING"]

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.right = 8
gaps.outer.top = 8
gaps.outer.bottom = 8

[mode.main.binding]
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

ctrl-alt-1 = 'workspace DEV'
ctrl-alt-2 = 'workspace WEB'
ctrl-alt-3 = 'workspace COMM'
ctrl-alt-4 = 'workspace DOCS'
ctrl-alt-5 = 'workspace PERSONAL'
ctrl-alt-6 = 'workspace MONITORING'

ctrl-alt-shift-1 = 'move-node-to-workspace DEV'
ctrl-alt-shift-2 = 'move-node-to-workspace WEB'
ctrl-alt-shift-3 = 'move-node-to-workspace COMM'
ctrl-alt-shift-4 = 'move-node-to-workspace DOCS'
ctrl-alt-shift-5 = 'move-node-to-workspace PERSONAL'
ctrl-alt-shift-6 = 'move-node-to-workspace MONITORING'

ctrl-alt-tab = 'workspace-back-and-forth'

# --- DEV ---
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm' # WezTerm
run = ['move-node-to-workspace DEV']

[[on-window-detected]]
if.app-id = 'com.sublimetext.4' # Sublime Text
run = ['move-node-to-workspace DEV']

[[on-window-detected]]
if.app-id = 'com.axosoft.gitkraken' # GitKraken
run = ['move-node-to-workspace DEV']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop' # Claude (desktop)
run = ['move-node-to-workspace DEV']

# --- WEB ---
[[on-window-detected]]
if.app-id = 'com.google.Chrome' # Google Chrome
run = ['move-node-to-workspace WEB']

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.agimnkijcaahngcdmfeangaknmldooml' # YouTube (Chrome app/PWA)
run = ['move-node-to-workspace WEB']

# --- COMM ---
[[on-window-detected]]
if.app-id = 'com.apple.iCal' # Calendário
run = ['move-node-to-workspace COMM']

# --- DOCS ---
[[on-window-detected]]
if.app-id = 'md.obsidian' # Obsidian
run = ['move-node-to-workspace DOCS']

[[on-window-detected]]
if.app-id = 'notion.id' # Notion
run = ['move-node-to-workspace DOCS']

[[on-window-detected]]
if.app-id = 'com.apple.Preview' # Pré-Visualização (Preview)
run = ['move-node-to-workspace DOCS']

# --- Floating: janelas de preferências / ferramentas pequenas, não fazem sentido em tile ---
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences' # Ajustes do Sistema
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.f-secure.fscunifiedui' # F-Secure
run = ['layout floating']
